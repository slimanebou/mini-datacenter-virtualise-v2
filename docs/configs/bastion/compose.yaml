services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro    # schéma chargé au premier démarrage
    networks: [db]
    restart: unless-stopped

  guacd:
    image: guacamole/guacd:1.5.5
    volumes:
      - ./recordings:/var/lib/guacamole/recordings
    networks: [app]
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.5.5
    depends_on: [postgres, guacd]
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      TOTP_ENABLED: "true"                                  # MFA obligatoire
      RECORDING_SEARCH_PATH: /var/lib/guacamole/recordings  # relecture des sessions
    volumes:
      - ./recordings:/var/lib/guacamole/recordings:ro
    networks: [app, db]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [guacamole]
    networks: [app]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  app: {}
  db:
    internal: true      # PostgreSQL n'a aucun accès réseau vers l'extérieur

volumes:
  pgdata:
