server {
    listen 8080;
    return 301 https://$host$request_uri;
}
server {
    listen 8443 ssl;
    server_name bastion.datacenter.lan;
    server_tokens off;
    absolute_redirect off;     # redirections relatives : le port interne 8443 n'apparaît plus
    
    ssl_certificate     /etc/nginx/certs/bastion.crt;
    ssl_certificate_key /etc/nginx/certs/bastion.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / { return 302 /guacamole/; }

    location /guacamole/ {
        proxy_pass http://guacamole:8080/guacamole/;
        proxy_buffering off;                       # flux d'écran en temps réel
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;    # WebSocket (tunnel de session)
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}
